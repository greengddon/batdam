:root{--green:#516d48;--dark:#263a29}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background:#e9eee5;color:var(--dark);overflow:hidden}header{position:fixed;z-index:20;top:0;left:0;right:0;height:65px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);display:flex;align-items:center;gap:24px;padding:0 36px;border-bottom:1px solid #dbe5d7}.brand{font-weight:900;font-size:23px;letter-spacing:-1px;white-space:nowrap}.brand small{font-size:11px;font-weight:600;letter-spacing:0;margin-left:9px;color:#81927c}.menus{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1}.menus::-webkit-scrollbar{display:none}.menus button{border:0;background:none;padding:10px 12px;white-space:nowrap;border-radius:18px;color:#5d6a5c;font-size:12px;cursor:pointer}.menus button:hover,.menus button.active{background:#e5eee0;color:#284b2c}.controls{display:flex;align-items:center;gap:9px}.controls button{border:1px solid #d4e0cf;background:white;color:#405b3e;border-radius:20px;padding:8px 12px;cursor:pointer;font-size:12px;white-space:nowrap}#viewport{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}#viewport::-webkit-scrollbar{display:none}.slide{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:80px 75px 28px;position:relative}.book{position:relative;max-width:min(1250px,calc(100vw - 160px));max-height:calc(100dvh - 120px);width:max-content;filter:drop-shadow(0 7px 12px rgba(35,53,33,.10));line-height:0}.mobile-halves{display:none}.book img{display:block;max-width:100%;max-height:calc(100dvh - 120px);width:auto;height:auto;object-fit:contain}.book.spread:after{content:'';position:absolute;pointer-events:none;top:0;bottom:0;left:50%;width:3.2%;transform:translateX(-50%);background:linear-gradient(90deg,rgba(22,35,21,.025),rgba(25,35,25,.07) 46%,rgba(255,255,255,.09) 52%,rg </style></head><body><header><div class="brand">donggubat <small>VOL.15 · WINTER 2026</small></div><nav class="menus" id="menus" aria-label="목차"></nav><div class="controls"><button id="toggle" aria-label="자동 넘김 일시정지">Ⅱ 일시정지</button></div></header><div class="progress" id="progress"></div><main id="viewport" aria-label="동구밭 웹진"></main><aside class="dots" id="dots" aria-label="페이지 탐색"></aside><script>
const names=["표지", "발행인 메시지 · 목차", "기업 연혁", "CEO 메시지 · 경영철학", "기업 비전", "임원 인터뷰", "사업 및 제품 소개", "대표 제품 · 신제품", "브랜드 경쟁력 · 프로모션", "플로깅 캠페인", "나눔 활동", "오늘의 뉴스", "가꿈지기 인터뷰", "사내 문화 · 챌린지", "뒤표지"];const main=document.querySelector('#viewport'),dots=document.querySelector('#dots'),menus=document.querySelector('#menus'),progress=document.querySelector('#progress'),toggle=document.querySelector('#toggle');let active=0,playing=true,elapsed=0,last=performance.now(),isScrolling=false;const menuItems=[['표지',0],['목차',1],['기업 소개',2],['제품 소개',6],['사내 소식',9],['사내 문화',13],['뒤표지',14]];
names.forEach((name,i)=>{const section=document.createElement('section');section.className='slide';section.id='page-'+(i+1);section.setAttribute('aria-label',name);section.innerHTML=`<div class="book ${i>0&&i<14?'spread':''}"><img src="images/page${String(i+1).padStart(2,'0')}.jpg" alt="${name}" ${i===0?'fetchpriority="high"':'loading="lazy"'}></div><div class="counter">${String(i+1).padStart(2,'0')} / ${names.length}</div>`;if(i>0&&i<14){const halves=document.createElement('div');halves.className='mobile-halves';['left','right'].forEach(side=>{const half=document.createElement('div');half.className='half '+side;half.innerHTML=`<img src="images/page${String(i+1).padStart(2,'0')}.jpg" alt="${name} ${side==='left'?'왼쪽':'오른쪽'} 페이지" loading="lazy">`;halves.appendChild(half)});section.querySelector('.book').appendChild(halves)}main.appendChild(section);const dot=document.createElement('button');dot.className='dot';dot.setAttribute('aria-label',`${i+1}페이지 ${name}`);dot.innerHTML=`<span class="tip">${name}</span>`;dot.onclick=()=>go(i);dots.appendChild(dot)});menuItems.forEach(([name,i])=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>go(i);menus.appendChild(b)});const slides=[...document.querySelectorAll('.slide')],dotEls=[...dots.children],menuEls=[...menus.children];function go(i){i=(i+names.length)%names.length;elapsed=0;slides[i].scrollIntoView({behavior:'smooth',block:'start'});setActive(i)}function setActive(i){active=i;dotEls.forEach((d,j)=>d.classList.toggle('active',i===j));let idx=0;menuItems.forEach((m,j)=>{if(i>=m[1])idx=j});menuEls.forEach((b,j)=>b.classList.toggle('active',j===idx));}setActive(0);
let scrollEnd;main.addEventListener('scroll',()=>{let i=Math.round(main.scrollTop/main.clientHeight);if(i!==active){setActive(Math.min(names.length-1,Math.max(0,i)));elapsed=0}clearTimeout(scrollEnd);scrollEnd=setTimeout(()=>{},180)},{passive:true});toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'Ⅱ 일시정지':'▶ 자동 재생';toggle.setAttribute('aria-label',playing?'자동 넘김 일시정지':'자동 넘김 재생');elapsed=0;};function tick(now){let delta=Math.min(now-last,250);last=now;if(playing&&!document.hidden){elapsed+=delta;if(elapsed>=30000){go(active+1);elapsed=0}}progress.style.width=(playing?elapsed/30000*100:0)+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick);document.addEventListener('keydown',e=>{if(['ArrowDown','PageDown','ArrowRight'].includes(e.key)){e.preventDefault();go(active+1)}if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key)){e.preventDefault();go(active-1)}});
</script></body></html>
